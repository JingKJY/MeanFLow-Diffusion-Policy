[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meanflow-diffusion-policy"
version = "0.1.0"
description = "MeanFlow action generation with Diffusion Policy infrastructure for robot manipulation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "MDP Contributors"},
]
keywords = ["robotics", "imitation-learning", "diffusion-policy", "meanflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["Mix_diffusion_policy*"]

[tool.setuptools.package-data]
Mix_diffusion_policy = [
  "config/**/*.yaml",
  "env/**/*.txt",
  "env/**/*.xml",
  "env/**/*.stl",
  "env/**/*.obj",
  "env/**/*.mtl",
  "env/**/*.dae",
  "env/**/*.png",
  "env/**/*.jpg",
]
